<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Resilience Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../../assets/css/rtl.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../../index.html" class="logo-brand" style="color: white;">
                <i class="fas fa-microchip"></i>
                <span>ResilienceLabs</span>
            </a>
        </div>
        <nav class="sidebar-menu">
            <ul>
                <li><a href="overview.html"><i class="fas fa-th-large"></i> Overview</a></li>
                <li><a href="experiments.html"><i class="fas fa-flask"></i> Experiments</a></li>
                <li><a href="blast-radius.html"><i class="fas fa-bullseye"></i> Blast Radius</a></li>
                <li><a href="game-days.html"><i class="fas fa-gamepad"></i> Game Days</a></li>
                <li><a href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a></li>
                <li><a href="settings.html" class="active"><i class="fas fa-cog"></i> Settings</a></li>
                <li style="margin-top: auto;"><a href="../../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>
    </aside>

    <div class="dashboard-main">
        <header class="dashboard-header">
            <div class="flex items-center" style="gap: 15px;">
                <i class="fas fa-bars sidebar-toggle"></i>
                <h3 style="margin: 0;">System Settings</h3>
            </div>
            <div class="header-actions">
                <button class="rtl-toggle"><i class="fas fa-language"></i></button>
                <button class="theme-toggle"><i class="fas fa-moon"></i></button>
                <div class="profile-info flex items-center" style="gap: 10px; padding: 5px 15px; background: #f8fafc; border-radius: var(--radius-full); border: 1px solid #e2e8f0;">
                    <div style="width: 30px; height: 30px; background: var(--secondary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.8rem;">JD</div>
                    <span style="font-weight: 600; font-size: 0.9rem;">John Doe</span>
                </div>
            </div>
        </header>

        <main style="padding: var(--space-xl);">
            <div class="card" style="text-align: left; max-width: 800px;">
                <h3 style="text-align: left; margin-bottom: 25px;">General Configuration</h3>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Organization Name</label>
                    <input type="text" value="Resilience Labs Ops" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-md);">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Primary Cloud Provider</label>
                    <select style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-md);">
                        <option>AWS (Amazon Web Services)</option>
                        <option>Google Cloud Platform</option>
                        <option>Microsoft Azure</option>
                    </select>
                </div>
                <div style="margin-bottom: 30px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" checked style="width: 18px; height: 18px;">
                        <span>Enable Slack Notifications for Failed Experiments</span>
                    </label>
                </div>
                <button class="btn btn-primary">Save Changes</button>
            </div>
        </main>
    </div>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/dashboard.js"></script>
</body>
</html>
