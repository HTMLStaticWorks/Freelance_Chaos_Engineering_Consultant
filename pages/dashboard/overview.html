<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRE Overview | Resilience Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../../assets/css/rtl.css">
</head>
<body class="dashboard-layout">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../../index.html" class="logo-brand" style="color: white;">
                <i class="fas fa-microchip"></i>
                <span>ResilienceLabs</span>
            </a>
        </div>
        <nav class="sidebar-menu">
            <ul>
                <li><a href="overview.html" class="active"><i class="fas fa-th-large"></i> Overview</a></li>
                <li><a href="experiments.html"><i class="fas fa-flask"></i> Experiments</a></li>
                <li><a href="blast-radius.html"><i class="fas fa-bullseye"></i> Blast Radius</a></li>
                <li><a href="game-days.html"><i class="fas fa-gamepad"></i> Game Days</a></li>
                <li><a href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                <li style="margin-top: auto;"><a href="../../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>
    </aside>

    <div class="dashboard-main">
        <header class="dashboard-header">
            <div class="flex items-center" style="gap: 15px;">
                <i class="fas fa-bars sidebar-toggle"></i>
                <h3 style="margin: 0;">SRE Overview</h3>
            </div>
            <div class="header-actions">
                <button class="rtl-toggle"><i class="fas fa-language"></i></button>
                <button class="theme-toggle"><i class="fas fa-moon"></i></button>
                <div class="profile-info flex items-center" style="gap: 10px; padding: 5px 15px; background: #f8fafc; border-radius: var(--radius-full); border: 1px solid #e2e8f0;">
                    <div style="width: 30px; height: 30px; background: var(--secondary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.8rem;">JD</div>
                    <span style="font-weight: 600; font-size: 0.9rem;">John Doe</span>
                </div>
            </div>
        </header>

        <main style="padding: var(--space-xl);">
            <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-lg); margin-bottom: var(--space-xl);">
                <div class="stat-card">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Total Experiments</p>
                    <h2 style="text-align: left; margin: 10px 0;">128</h2>
                    <div class="stat-bar-container"><div class="stat-bar" data-value="80"></div></div>
                </div>
                <div class="stat-card">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Success Rate</p>
                    <h2 style="text-align: left; margin: 10px 0;">94.2%</h2>
                    <div class="stat-bar-container"><div class="stat-bar" data-value="94" style="background: #10b981;"></div></div>
                </div>
                <div class="stat-card">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Active Agents</p>
                    <h2 style="text-align: left; margin: 10px 0;">42</h2>
                    <div class="stat-bar-container"><div class="stat-bar" data-value="60"></div></div>
                </div>
                <div class="stat-card">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Cluster Health</p>
                    <h2 style="text-align: left; margin: 10px 0;">Optimal</h2>
                    <div class="stat-bar-container"><div class="stat-bar" data-value="100" style="background: #3b82f6;"></div></div>
                </div>
            </div>

            <div class="card" style="text-align: left;">
                <h3 style="text-align: left; margin-bottom: 20px;">System Status</h3>
                <div style="height: 300px; background: #f8fafc; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; border: 1px dashed #ddd;">
                    <p style="color: var(--text-muted);">Real-time Topology Map Visualization</p>
                </div>
            </div>
        </main>
    </div>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/dashboard.js"></script>
</body>
</html>
