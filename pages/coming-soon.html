<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Soon | Chaos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="dark-mode">

    <main>
        <!-- Section 1: Countdown -->
        <section class="section text-center" style="min-height: 70vh; display: flex; align-items: center; padding-top: 100px;">
            <div class="container">
                <a href="../index.html" class="logo-brand justify-center" style="color: white; margin-bottom: 40px;">
                    <i class="fas fa-microchip"></i>
                    <span>Chaos</span>
                </a>
                <h1 style="color: white; font-size: 3.5rem;">The Chaos Toolkit is <br> <span style="color: var(--secondary-color);">Scaling...</span></h1>
                <p style="color: #94a3b8; max-width: 600px; margin: 0 auto 40px;">We are finalizing our automated blast radius control engine. Launching in early Summer 2024.</p>
                
                <div class="flex justify-center" style="gap: 20px;">
                    <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: var(--radius-md); min-width: 100px;">
                        <div style="font-size: 2.5rem; font-weight: 800; color: var(--secondary-color);">14</div>
                        <div style="font-size: 0.8rem; text-transform: uppercase;">Days</div>
                    </div>
                    <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: var(--radius-md); min-width: 100px;">
                        <div style="font-size: 2.5rem; font-weight: 800; color: var(--secondary-color);">08</div>
                        <div style="font-size: 0.8rem; text-transform: uppercase;">Hours</div>
                    </div>
                    <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: var(--radius-md); min-width: 100px;">
                        <div style="font-size: 2.5rem; font-weight: 800; color: var(--secondary-color);">45</div>
                        <div style="font-size: 0.8rem; text-transform: uppercase;">Mins</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 2: Newsletter -->
        <section class="section">
            <div class="container text-center">
                <div style="max-width: 500px; margin: 0 auto;">
                    <h3>Get Notified on Provisioning</h3>
                    <form class="flex" style="gap: 10px; margin-top: 20px;">
                        <input type="email" placeholder="Email Address" style="flex: 1; padding: 12px; border-radius: var(--radius-md); border: none; background: #1e293b; color: white;">
                        <button type="submit" class="btn btn-primary">Notify Me</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Section 3: Socials -->
        <section class="section">
            <div class="container text-center">
                <div class="flex justify-center" style="gap: 30px;">
                    <a href="#" style="color: white; font-size: 1.5rem;"><i class="fab fa-twitter"></i></a>
                    <a href="#" style="color: white; font-size: 1.5rem;"><i class="fab fa-linkedin"></i></a>
                    <a href="#" style="color: white; font-size: 1.5rem;"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </section>
    </main>

    <script src="../assets/js/main.js"></script>
</body>
</html>
