<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Chaos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/rtl.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
            position: relative;
        }
        .auth-utils {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .auth-utils button {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .auth-card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: var(--space-3xl);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-decoration: none;
        }
        .auth-logo i {
            color: var(--secondary-color);
        }
        @media (max-width: 768px) {
            .auth-utils {
                top: 20px;
                right: 20px;
            }
            .auth-page {
                padding-top: 100px;
                align-items: flex-start;
            }
        }
        .auth-utils button:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .auth-card a:hover {
            color: var(--secondary-color);
            opacity: 0.8;
        }
        .auth-logo:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="dark-mode">

    <div class="auth-page">
        <div class="auth-utils">
            <button class="rtl-toggle">RTL</button>
            <button class="theme-toggle"><i class="fas fa-sun"></i></button>
        </div>

        <div class="auth-card">
            <a href="../index.html" class="auth-logo">
                <i class="fas fa-microchip"></i>
                <span>Chaos</span>
            </a>
            
            <h2 style="margin-bottom: 10px;">Request Access</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Join the elite SRE teams building resilient infrastructure.</p>

            <form>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary-color);">First Name</label>
                        <input type="text" placeholder="" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-md);" required>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary-color);">Last Name</label>
                        <input type="text" placeholder="" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-md);" required>
                    </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary-color);">Work Email</label>
                    <input type="email" placeholder="" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-md);" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary-color);">Company Name</label>
                    <input type="text" placeholder="" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-md);" required>
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary-color);">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="" style="width: 100%; padding: 12px; padding-right: 45px; border: 1px solid #ddd; border-radius: var(--radius-md);" required>
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary-color);">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="" style="width: 100%; padding: 12px; padding-right: 45px; border: 1px solid #ddd; border-radius: var(--radius-md);" required>
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Create Account</button>

                <div class="auth-separator">Or sign up with</div>
                
                <div class="social-btns">
                    <button type="button" class="btn btn-social"><i class="fab fa-google" style="color: #DB4437;"></i> Google</button>
                    <button type="button" class="btn btn-social"><i class="fab fa-apple"></i> Apple</button>
                </div>
            </form>

            <div style="margin-top: 30px; text-align: center;">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Already have an account? <a href="login.html" style="color: var(--secondary-color); font-weight: 600;">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        if (togglePassword && password) {
            togglePassword.addEventListener('click', function (e) {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.classList.toggle('fa-eye-slash');
            });
        }
    </script>
</body>
</html>
